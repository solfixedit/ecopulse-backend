spring:
  datasource:
    # Database settings for the local Docker Compose PostgreSQL instance.
    url: jdbc:postgresql://localhost:5432/ecopulse
    username: sol
    password: ecopulse
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Hibernate can detect the PostGIS dialect from the PostgreSQL driver.
        # Keep the dialect unset unless a specific override is needed.